services:
  # === Laravel App ===
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbearia_app
    restart: always
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - barbearia-net
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-agenda_barbearia}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

  # === MySQL ===
  db:
    image: mysql:8.0
    container_name: barbearia_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-agenda_barbearia}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - barbearia_mysql:/var/lib/mysql
    networks:
      - barbearia-net

  # === Redis ===
  redis:
    image: redis:7-alpine
    container_name: barbearia_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - barbearia-net

  # === Evolution API ===
  evolution_api:
    image: evoapicloud/evolution-api:v1.8.7
    container_name: evolution_api
    restart: always
    depends_on:
      - redis
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      LOG_LEVEL: ERROR
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-changeme_super_secret_key_2026}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: mongodb
      DATABASE_CONNECTION_URI: mongodb://mongodb:27017/evolution
      REDIS_ENABLED: "true"
      REDIS_URI: redis://redis:6379
      DEL_INSTANCE: "false"
      STORE_INSTANCES: "true"
      STORE_MESSAGES: "true"
      WEBHOOK_ENABLED: "true"
      WEBHOOK_URL: http://host.docker.internal:8001/api/webhook/evolution
      WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS: MESSAGES_UPSERT
      WEBHOOK_BASE64: "false"
    networks:
      - barbearia-net

  # === MongoDB (Evolution API) ===
  mongodb:
    image: mongo:6
    container_name: evolution_mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - barbearia-net

networks:
  barbearia-net:
    driver: bridge

volumes:
  barbearia_mysql:
