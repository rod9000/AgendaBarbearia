services:
  redis:
    image: redis:6-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --port 6379 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net

  postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: always
    command: postgres -c max_connections=1000
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution_pass}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - evolution-net

  api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net
    env_file:
      - .env
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      LOG_LEVEL: ERROR

      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-changeme_super_secret_key_2026}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:-evolution_pass}@postgres:5432/evolution

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution-cache
      CACHE_REDIS_TTL: 604800
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_LOCAL_TTL: 86400

      DEL_INSTANCE: "false"
      STORE_INSTANCES: "true"
      STORE_MESSAGES: "true"

      WEBHOOK_ENABLED: "true"
      WEBHOOK_URL: ${WEBHOOK_URL:-http://host.docker.internal:8001/api/webhook/evolution}
      WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS: MESSAGES_UPSERT
      WEBHOOK_BASE64: "false"

networks:
  evolution-net:
    driver: bridge

volumes:
  evolution_instances:
  evolution_redis:
  evolution_postgres:
